<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b6b7b"/>
    </marker>
  </defs>

  <rect width="1000" height="640" fill="#0f1720"/>

  <text x="500" y="36" text-anchor="middle" fill="#f5f7fa" font-size="22" font-weight="700">Smart Walker — System Block Diagram</text>
  <text x="500" y="58" text-anchor="middle" fill="#8b98a5" font-size="13">Pin mapping reconstructed from the Arduino sketch</text>

  <!-- Arduino Uno (center) -->
  <rect x="400" y="270" width="200" height="100" rx="10" fill="#1c2b3a" stroke="#4da3ff" stroke-width="2"/>
  <text x="500" y="310" text-anchor="middle" fill="#eaf2fb" font-size="16" font-weight="700">Arduino Uno</text>
  <text x="500" y="330" text-anchor="middle" fill="#9fb4c7" font-size="12">ATmega328P</text>
  <text x="500" y="350" text-anchor="middle" fill="#9fb4c7" font-size="11">I2C: SDA=A4  SCL=A5</text>

  <!-- MPU6050 Right -->
  <rect x="60" y="60" width="220" height="80" rx="8" fill="#1c2b3a" stroke="#5bd18f" stroke-width="1.5"/>
  <text x="170" y="88" text-anchor="middle" fill="#eaf2fb" font-size="14" font-weight="600">MPU6050 — Right</text>
  <text x="170" y="106" text-anchor="middle" fill="#9fb4c7" font-size="11">I2C addr 0x68 (AD0→GND)</text>
  <text x="170" y="122" text-anchor="middle" fill="#9fb4c7" font-size="11">Tilt / fall sensing</text>
  <line x1="280" y1="100" x2="410" y2="275" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- MPU6050 Left -->
  <rect x="720" y="60" width="220" height="80" rx="8" fill="#1c2b3a" stroke="#5bd18f" stroke-width="1.5"/>
  <text x="830" y="88" text-anchor="middle" fill="#eaf2fb" font-size="14" font-weight="600">MPU6050 — Left</text>
  <text x="830" y="106" text-anchor="middle" fill="#9fb4c7" font-size="11">I2C addr 0x69 (AD0→VCC)</text>
  <text x="830" y="122" text-anchor="middle" fill="#9fb4c7" font-size="11">Tilt / fall sensing</text>
  <line x1="720" y1="100" x2="590" y2="275" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- HX711 Right -->
  <rect x="30" y="200" width="220" height="80" rx="8" fill="#1c2b3a" stroke="#f2c14e" stroke-width="1.5"/>
  <text x="140" y="228" text-anchor="middle" fill="#eaf2fb" font-size="14" font-weight="600">HX711 — Right</text>
  <text x="140" y="246" text-anchor="middle" fill="#9fb4c7" font-size="11">DT: Pin 3   SCK: Pin 2</text>
  <text x="140" y="262" text-anchor="middle" fill="#9fb4c7" font-size="11">Right load cell</text>
  <line x1="250" y1="240" x2="405" y2="300" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- HX711 Left -->
  <rect x="750" y="200" width="220" height="80" rx="8" fill="#1c2b3a" stroke="#f2c14e" stroke-width="1.5"/>
  <text x="860" y="228" text-anchor="middle" fill="#eaf2fb" font-size="14" font-weight="600">HX711 — Left</text>
  <text x="860" y="246" text-anchor="middle" fill="#9fb4c7" font-size="11">DT: Pin 5   SCK: Pin 4</text>
  <text x="860" y="262" text-anchor="middle" fill="#9fb4c7" font-size="11">Left load cell</text>
  <line x1="750" y1="240" x2="595" y2="300" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- HC-SR04 Right -->
  <rect x="30" y="460" width="220" height="80" rx="8" fill="#1c2b3a" stroke="#f28e4e" stroke-width="1.5"/>
  <text x="140" y="488" text-anchor="middle" fill="#eaf2fb" font-size="14" font-weight="600">HC-SR04 — Right</text>
  <text x="140" y="506" text-anchor="middle" fill="#9fb4c7" font-size="11">TRIG: Pin 6   ECHO: Pin 7</text>
  <text x="140" y="522" text-anchor="middle" fill="#9fb4c7" font-size="11">Obstacle detection</text>
  <line x1="250" y1="480" x2="405" y2="345" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- HC-SR04 Left -->
  <rect x="750" y="460" width="220" height="80" rx="8" fill="#1c2b3a" stroke="#f28e4e" stroke-width="1.5"/>
  <text x="860" y="488" text-anchor="middle" fill="#eaf2fb" font-size="14" font-weight="600">HC-SR04 — Left</text>
  <text x="860" y="506" text-anchor="middle" fill="#9fb4c7" font-size="11">TRIG: Pin 8   ECHO: Pin 9</text>
  <text x="860" y="522" text-anchor="middle" fill="#9fb4c7" font-size="11">Obstacle detection</text>
  <line x1="750" y1="480" x2="595" y2="345" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Buzzer -->
  <rect x="400" y="440" width="200" height="70" rx="8" fill="#1c2b3a" stroke="#e05c5c" stroke-width="1.5"/>
  <text x="500" y="468" text-anchor="middle" fill="#eaf2fb" font-size="14" font-weight="600">Passive Buzzer</text>
  <text x="500" y="486" text-anchor="middle" fill="#9fb4c7" font-size="11">Pin 11</text>
  <line x1="500" y1="440" x2="500" y2="372" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LCD -->
  <rect x="400" y="540" width="200" height="70" rx="8" fill="#1c2b3a" stroke="#9d7bd8" stroke-width="1.5"/>
  <text x="500" y="568" text-anchor="middle" fill="#eaf2fb" font-size="14" font-weight="600">16×2 I2C LCD</text>
  <text x="500" y="586" text-anchor="middle" fill="#9fb4c7" font-size="11">I2C addr 0x27</text>
  <line x1="500" y1="540" x2="500" y2="372" stroke="#5b6b7b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="1,0"/>

  <!-- Legend -->
  <g transform="translate(20,600)">
    <rect x="0" y="0" width="12" height="12" fill="#1c2b3a" stroke="#5bd18f"/>
    <text x="18" y="10" fill="#9fb4c7" font-size="11">IMU (I2C)</text>
    <rect x="100" y="0" width="12" height="12" fill="#1c2b3a" stroke="#f2c14e"/>
    <text x="118" y="10" fill="#9fb4c7" font-size="11">Load Cell</text>
    <rect x="195" y="0" width="12" height="12" fill="#1c2b3a" stroke="#f28e4e"/>
    <text x="213" y="10" fill="#9fb4c7" font-size="11">Ultrasonic</text>
    <rect x="295" y="0" width="12" height="12" fill="#1c2b3a" stroke="#e05c5c"/>
    <text x="313" y="10" fill="#9fb4c7" font-size="11">Buzzer</text>
    <rect x="370" y="0" width="12" height="12" fill="#1c2b3a" stroke="#9d7bd8"/>
    <text x="388" y="10" fill="#9fb4c7" font-size="11">LCD (I2C)</text>
  </g>
</svg>
